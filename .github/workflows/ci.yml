name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: DSH ${{ matrix.dsh }} / Node 22 / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        dsh: ['0.2.0-rc.2', '0.2.1-rc.1']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Cache downloads only; each job installs its own isolated dependencies.
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Lock install, strict types, build, all tests and actual package check
        run: node test/tools/verify-install.mjs --dsh-version '${{ matrix.dsh }}'
